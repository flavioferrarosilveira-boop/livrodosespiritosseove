<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Livro dos Espíritos — Busca</title>
  <link rel="stylesheet" href="assets/css/styles.css"/>
</head>
<body>
  <div class="container">
    <div class="header">
  <div class="header-top">
    <div class="brand">
      <h1>Livro dos Espíritos</h1>
      <div class="sub">Busca por número ou por palavras (pergunta e resposta)</div>
    </div>
    <span class="badge">Espiritismo</span>
  </div>
  <div class="banner-wrap">
    <img src="assets/img/banner.png" alt="Banner"/>
  </div>
  <div class="nav">
    <div class="badge">Portal do Estudo</div>
    <div class="links">
      <a class="button" href="index.html">Início</a>
      <a class="button" href="livro.html" aria-current="page">Livro</a>
      <a class="button" href="calendario.html">Calendário</a>
      <a class="button" href="indicacoes.html">Indicações</a>
      <a class="button" href="biblioteca.html">Biblioteca</a>
    </div>
  </div>
</div>
    <div class="card" style="margin-top:16px;">
      <div class="card-h">
        <h2>Buscar perguntas</h2>
        <p>Digite um número (ex.: 1) ou uma palavra (ex.: Deus, alma, reencarnação).</p>
      </div>
      <div class="card-b">
        <div class="row">
          <div><div class="small">Número</div><input id="le-numero" placeholder="Ex.: 1"/></div>
          <div><div class="small">Palavra / tema</div><input id="le-texto" placeholder="Ex.: Deus"/></div>
        </div>
        <div style="margin-top:10px;">
          <a class="button" href="#" id="le-buscar">Buscar</a>
        </div>
        <div id="le-resultados" class="list" style="margin-top:12px;"></div>
      </div>
    </div>
    <div class="footer"><span id="visitas">Visitas: —</span></div>
  </div>

  <script src="data/livro_dos_espiritos_data.js"></script>
  <script type="module">
    import { initLivro } from "./js/livro.js";
    import { initVisitas } from "./js/visitas.js";
    initLivro(); initVisitas();
  </script>
</body>
</html>

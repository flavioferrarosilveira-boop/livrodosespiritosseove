<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 220" role="img" aria-label="Retrato de Allan Kardec">
  <!-- Oval medallion background -->
  <ellipse cx="90" cy="92" rx="84" ry="90" fill="#14100a"/>
  <ellipse cx="90" cy="92" rx="81" ry="87" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0.55"/>
  <ellipse cx="90" cy="92" rx="77" ry="83" fill="none" stroke="#c9a84c" stroke-width="0.5" opacity="0.25"/>

  <!-- Jacket / shoulders -->
  <path d="M4 220 Q8 158 34 143 L90 172 L146 143 Q172 158 176 220 Z" fill="#0c0a06"/>
  <!-- Left lapel -->
  <path d="M68 147 L76 160 Q74 167 70 163 L59 150 Q54 142 68 147Z" fill="#1a1508"/>
  <!-- Right lapel -->
  <path d="M112 147 L104 160 Q106 167 110 163 L121 150 Q126 142 112 147Z" fill="#1a1508"/>
  <!-- White cravat -->
  <path d="M74 145 L90 168 L106 145 L99 134 L81 134 Z" fill="#d8cfb0"/>
  <!-- Bow-tie -->
  <path d="M82 136 Q78 132 80 136 Q78 140 82 136Z" fill="#0c0a06"/>
  <path d="M98 136 Q102 132 100 136 Q102 140 98 136Z" fill="#0c0a06"/>
  <ellipse cx="90" cy="136" rx="8" ry="4.5" fill="#0e0b07"/>

  <!-- Neck -->
  <path d="M76 134 Q80 152 90 155 Q100 152 104 134 Q98 146 90 148 Q82 146 76 134Z" fill="#bf8a5f"/>

  <!-- Head / face -->
  <ellipse cx="90" cy="90" rx="47" ry="55" fill="#c4895e"/>

  <!-- Forehead highlight (bald) -->
  <ellipse cx="87" cy="62" rx="33" ry="22" fill="#d4a070" opacity="0.35"/>

  <!-- Side hair – left -->
  <path d="M43 118 Q39 96 46 72 Q52 56 62 58 Q51 74 49 104 Q47 112 43 122Z" fill="#1e180f"/>
  <!-- Side hair – right -->
  <path d="M137 118 Q141 96 134 72 Q128 56 118 58 Q129 74 131 104 Q133 112 137 122Z" fill="#1e180f"/>

  <!-- Full beard -->
  <path d="M56 140 Q60 170 76 180 Q90 186 104 180 Q120 170 124 140 Q108 163 90 166 Q72 163 56 140Z" fill="#1e180f"/>
  <!-- Sideburns left -->
  <path d="M50 122 Q48 138 55 152 Q52 138 53 122Z" fill="#1e180f"/>
  <!-- Sideburns right -->
  <path d="M130 122 Q132 138 125 152 Q128 138 127 122Z" fill="#1e180f"/>
  <!-- Mustache -->
  <path d="M68 138 Q79 146 90 144 Q101 146 112 138 Q101 151 90 150 Q79 151 68 138Z" fill="#120e08"/>

  <!-- Eyebrow left -->
  <path d="M58 86 Q70 81 83 84" stroke="#1e180f" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Eyebrow right -->
  <path d="M97 84 Q110 81 122 86" stroke="#1e180f" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Left eye -->
  <ellipse cx="70" cy="97" rx="9.5" ry="6.5" fill="#dfc99a" opacity="0.88"/>
  <ellipse cx="70" cy="97" rx="7.5" ry="5.5" fill="#1c1510"/>
  <circle cx="72" cy="96" r="1.5" fill="rgba(255,255,255,.32)"/>
  <!-- Right eye -->
  <ellipse cx="110" cy="97" rx="9.5" ry="6.5" fill="#dfc99a" opacity="0.88"/>
  <ellipse cx="110" cy="97" rx="7.5" ry="5.5" fill="#1c1510"/>
  <circle cx="112" cy="96" r="1.5" fill="rgba(255,255,255,.32)"/>

  <!-- Nose bridge -->
  <path d="M86 101 Q83 114 80 121 Q90 126 100 121 Q97 114 94 101" fill="rgba(0,0,0,.06)" stroke="#a07050" stroke-width="0.5"/>
  <!-- Nostrils -->
  <ellipse cx="82" cy="121" rx="5" ry="2.8" fill="rgba(0,0,0,.13)"/>
  <ellipse cx="98" cy="121" rx="5" ry="2.8" fill="rgba(0,0,0,.13)"/>

  <!-- Lips -->
  <path d="M77 132 Q90 137 103 132" stroke="#7a4530" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Ears -->
  <ellipse cx="43" cy="100" rx="7.5" ry="11" fill="#bf8a5f"/>
  <path d="M45 93 Q43 100 45 107" stroke="#9a6840" stroke-width="1.5" fill="none"/>
  <ellipse cx="137" cy="100" rx="7.5" ry="11" fill="#bf8a5f"/>
  <path d="M135 93 Q137 100 135 107" stroke="#9a6840" stroke-width="1.5" fill="none"/>

  <!-- Subtle face shading -->
  <path d="M44 112 Q46 126 52 138" stroke="rgba(0,0,0,.06)" stroke-width="3" fill="none"/>
  <path d="M136 112 Q134 126 128 138" stroke="rgba(0,0,0,.06)" stroke-width="3" fill="none"/>

  <!-- Name plate line -->
  <line x1="20" y1="198" x2="160" y2="198" stroke="#c9a84c" stroke-width="0.8" opacity="0.4"/>
  <text x="90" y="212" text-anchor="middle"
        font-family="Georgia,'Times New Roman',serif"
        font-size="12.5" fill="#c9a84c" letter-spacing="1.8">ALLAN KARDEC</text>
  <text x="90" y="225" text-anchor="middle"
        font-family="Georgia,serif"
        font-size="9" fill="rgba(201,168,76,.5)" letter-spacing="0.5">1804 – 1869</text>
</svg>

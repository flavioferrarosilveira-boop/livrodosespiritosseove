<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Livro dos Espíritos — Allan Kardec</title>
  <link rel="stylesheet" href="assets/css/reader.css"/>
</head>
<body>

  <!-- Mobile overlay -->
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <!-- Mobile top bar -->
  <div class="topbar">
    <button class="menu-btn" id="menu-btn" onclick="toggleSidebar()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <span class="topbar-title">Livro dos Espíritos</span>
    <div class="topbar-search">
      <input type="search" id="busca-top" placeholder="Buscar…" oninput="onBusca(this.value)" autocomplete="off"/>
    </div>
  </div>

  <div class="app">

    <!-- ══════════ SIDEBAR ══════════ -->
    <aside class="sidebar" id="sidebar">

      <div class="sb-brand">
        <img class="sb-portrait" src="assets/img/kardec.svg" alt="Retrato de Allan Kardec"/>
        <h1 class="sb-title">Livro dos Espíritos</h1>
        <div class="sb-sub">Allan Kardec · 1857</div>
      </div>

      <div class="sb-search-wrap">
        <input type="search" id="busca-sb" placeholder="Buscar no livro…"
               oninput="onBusca(this.value)" autocomplete="off"/>
        <div class="sb-count" id="busca-count" hidden></div>
      </div>

      <nav class="sb-nav" id="sb-nav" aria-label="Índice"></nav>

      <div class="sb-footer">
        <a href="estudo.html" class="sb-link">🎓 Estudo Guiado</a>
        <a href="notas.html" class="sb-link">✏️ Minhas Notas</a>
      </div>

    </aside>

    <!-- ══════════ MAIN ══════════ -->
    <main class="main" id="main">

      <!-- Mensagem do dia -->
      <div class="msg-card" id="msg-card" hidden>
        <div class="msg-label" id="msg-label">☀ Mensagem do dia</div>
        <div class="msg-titulo" id="msg-titulo"></div>
        <blockquote class="msg-texto" id="msg-texto"></blockquote>
        <button class="msg-close" id="msg-close" onclick="dismissMsg()" aria-label="Fechar">×</button>
      </div>

      <!-- Book -->
      <div class="book" id="book"></div>

    </main>

  </div>

  <script src="data/livro_dos_espiritos_data.js"></script>
  <script src="data/evangelho_mensagens_data.js"></script>
  <script src="js/reader.js"></script>
</body>
</html>
